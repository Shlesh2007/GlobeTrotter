services:
  - type: web
    name: globe-trotter
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn traveloop.wsgi:application --bind 0.0.0.0:${PORT}
    envVars:
      - key: DEBUG
        value: "True"          # <‑‑ enable debugging
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: globe_trotter_db
    autoDeploy: true
    healthCheckPath: "/"