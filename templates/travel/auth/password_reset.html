{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<section class="auth-wrap py-5">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="glass-card p-4">
          <h1 class="h4 mb-2">Forgot your password?</h1>
          <p class="text-secondary">Enter your email and we will send reset instructions.</p>
          <form method="post">
            {% csrf_token %}
            <input type="email" name="email" class="form-control auth-input shadow-none mb-3" placeholder="Enter your email address" required style="border-radius: 8px;">
            <button type="submit" class="btn btn-primary w-100 mt-3 rounded-pill">Send OTP</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
