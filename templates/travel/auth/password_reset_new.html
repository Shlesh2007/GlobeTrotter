{% extends "base.html" %}

{% block title %}Set New Password{% endblock %}

{% block content %}
<section class="auth-wrap py-5">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="glass-card p-4">
          <h1 class="h4 mb-2 text-white">Set New Password</h1>
          <p class="text-white/70">Please enter your new password below.</p>
          <form method="post" class="mt-4">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
              <label class="text-white/70 small">{{ field.label }}</label>
              <input type="password" name="{{ field.name }}" class="form-control auth-input shadow-none mt-1" required style="border-radius: 8px;">
              {% if field.errors %}<div class="small text-danger mt-1">{{ field.errors }}</div>{% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary w-100 mt-4 rounded-pill">Save New Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
