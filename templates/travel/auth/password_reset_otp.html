{% extends "base.html" %}

{% block title %}Verify OTP{% endblock %}

{% block content %}
<section class="auth-wrap py-5">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="glass-card p-4">
          <h1 class="h4 mb-2 text-white">Enter Security Code</h1>
          <p class="text-white/70">We sent a 4-digit OTP to <strong>{{ email }}</strong>.</p>
          <form method="post">
            {% csrf_token %}
            <input type="text" name="otp" class="form-control auth-input shadow-none mb-3 text-center fs-3" placeholder="----" maxlength="4" required style="border-radius: 8px; letter-spacing: 10px;">
            <button type="submit" class="btn btn-primary w-100 mt-3 rounded-pill">Verify OTP</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
